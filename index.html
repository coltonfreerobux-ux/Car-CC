
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valley Slingshot Driving</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #87ceeb;
    user-select: none;
}

canvas {
    display: block;
}

#hud {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 100;
    color: white;
    text-shadow: 2px 2px 4px black;
    pointer-events: none;
}

#speedometer {
    width: 150px;
    height: 150px;
    border: 5px solid white;
    border-radius: 50%;
    position: relative;
    background: rgba(0,0,0,0.65);
    box-shadow: 0 0 15px black;
}

#needle {
    width: 4px;
    height: 60px;
    background: red;
    position: absolute;
    left: 68px;
    top: 15px;
    transform-origin: bottom center;
    transform: rotate(-130deg);
}

#speedText {
    text-align: center;
    margin-top: 10px;
    font-size: 25px;
    font-weight: bold;
}

#status {
    margin-top: 8px;
    font-size: 14px;
    background: rgba(0,0,0,0.5);
    padding: 8px;
    border-radius: 6px;
}

#slingshotPanel {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    width: 310px;
    text-align: center;
    color: white;
    font-weight: bold;
    text-shadow: 2px 2px 4px black;
}

#slingshot {
    position: relative;
    width: 300px;
    height: 120px;
    background: rgba(0,0,0,0.55);
    border: 2px solid rgba(255,255,255,0.6);
    border-radius: 18px;
    overflow: hidden;
    touch-action: none;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
}

#slingshotTitle {
    margin-bottom: 8px;
    font-size: 18px;
}

#slingshotBase {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 70px;
    height: 70px;
    transform: translate(-50%,-50%);
    border: 4px solid #b87935;
    border-radius: 50%;
    background: rgba(139,69,19,0.35);
}

#slingshotHandle {
    position: absolute;
    width: 44px;
    height: 44px;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffdb80, #e27a19 65%, #873b0b);
    border: 3px solid white;
    box-shadow: 0 0 12px black;
    cursor: grab;
    touch-action: none;
}

#slingshotHandle:active {
    cursor: grabbing;
}

#launchText {
    margin-top: 8px;
    font-size: 13px;
}

#launchPower {
    color: #ffdf64;
}

#resetButton {
    pointer-events: auto;
    margin-top: 8px;
    padding: 9px 20px;
    border: none;
    border-radius: 8px;
    background: #e64a35;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#resetButton:hover {
    background: #ff624b;
}
</style>
</head>

<body>

<div id="hud">

    <div id="speedometer">
        <div id="needle"></div>
    </div>

    <div id="speedText">0 MPH</div>

    <div id="status">
        VALLEY MODE<br>
        Ready to launch
    </div>

</div>

<div id="slingshotPanel">

    <div id="slingshotTitle">
        SLINGSHOT LAUNCH
    </div>

    <div id="slingshot">

        <div id="slingshotBase"></div>

        <div id="slingshotHandle"></div>

    </div>

    <div id="launchText">
        DRAG BACK TO LAUNCH
        <br>
        POWER: <span id="launchPower">0%</span>
    </div>

    <button id="resetButton">RESET CAR</button>

</div>

<script type="module">

import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

////////////////////////////////////////////////////
// SCENE
////////////////////////////////////////////////////

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
    0x87ceeb,
    180,
    1600
);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    5000
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

document.body.appendChild(renderer.domElement);

////////////////////////////////////////////////////
// TEXTURE GENERATOR
////////////////////////////////////////////////////

function proceduralTexture(type, size = 512) {

    const canvas = document.createElement("canvas");

    canvas.width = size;
    canvas.height = size;

    const ctx = canvas.getContext("2d");

    if (type === "grass") {

        ctx.fillStyle = "#376d25";

        ctx.fillRect(0, 0, size, size);

        for (let i = 0; i < 18000; i++) {

            const x = Math.random() * size;
            const y = Math.random() * size;

            ctx.strokeStyle = [
                "#497f30",
                "#568b37",
                "#315e21",
                "#659443",
                "#83a84c"
            ][Math.floor(Math.random() * 5)];

            ctx.lineWidth = 1 + Math.random() * 2;

            ctx.beginPath();

            ctx.moveTo(x, y);

            ctx.lineTo(
                x + (Math.random() - 0.5) * 5,
                y - Math.random() * 8
            );

            ctx.stroke();
        }
    }

    if (type === "bark") {

        ctx.fillStyle = "#55351e";

        ctx.fillRect(0, 0, size, size);

        for (let i = 0; i < 150; i++) {

            ctx.strokeStyle = [
                "#704727",
                "#3e2819",
                "#875a32"
            ][Math.floor(Math.random() * 3)];

            ctx.lineWidth = 2 + Math.random() * 5;

            ctx.beginPath();

            ctx.moveTo(Math.random() * size, 0);

            ctx.lineTo(
                Math.random() * size,
                size
            );

            ctx.stroke();
        }
    }

    const texture = new THREE.CanvasTexture(canvas);

    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;

    texture.colorSpace = THREE.SRGBColorSpace;

    return texture;
}

const grassTexture = proceduralTexture("grass");

const barkTexture = proceduralTexture("bark");

grassTexture.repeat.set(150, 150);

barkTexture.repeat.set(1, 3);

////////////////////////////////////////////////////
// LIGHTING
////////////////////////////////////////////////////

const sun = new THREE.DirectionalLight(
    0xffffff,
    2.5
);

sun.position.set(
    200,
    350,
    100
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -200;
sun.shadow.camera.right = 200;
sun.shadow.camera.top = 200;
sun.shadow.camera.bottom = -200;

scene.add(sun);

scene.add(
    new THREE.HemisphereLight(
        0xbde5ff,
        0x46652b,
        1.5
    )
);

////////////////////////////////////////////////////
// VALLEY TERRAIN
////////////////////////////////////////////////////

function heightAt(x, z) {

    const valleyWalls =
        Math.pow(Math.abs(z) / 250, 2) * 55;

    const rollingHills =
        Math.sin(x * 0.002) * 8 +
        Math.sin(z * 0.015) * 4 +
        Math.sin(x * 0.012 + z * 0.01) * 3;

    return valleyWalls + rollingHills - 5;
}

const terrainSize = 4000;
const terrainSegments = 180;

const terrainGeometry = new THREE.PlaneGeometry(
    terrainSize,
    terrainSize,
    terrainSegments,
    terrainSegments
);

terrainGeometry.rotateX(-Math.PI / 2);

const vertices = terrainGeometry.attributes.position;

for (let i = 0; i < vertices.count; i++) {

    const x = vertices.getX(i);
    const z = vertices.getZ(i);

    vertices.setY(
        i,
        heightAt(x, z)
    );
}

terrainGeometry.computeVertexNormals();

const terrain = new THREE.Mesh(
    terrainGeometry,
    new THREE.MeshStandardMaterial({
        map: grassTexture,
        roughness: 1
    })
);

terrain.receiveShadow = true;

scene.add(terrain);

////////////////////////////////////////////////////
// VALLEY MOUNTAINS
////////////////////////////////////////////////////

const mountainMaterials = [
    new THREE.MeshStandardMaterial({
        color: 0x526c49,
        roughness: 1
    }),
    new THREE.MeshStandardMaterial({
        color: 0x667c56,
        roughness: 1
    }),
    new THREE.MeshStandardMaterial({
        color: 0x435c43,
        roughness: 1
    })
];

for (let i = 0; i < 35; i++) {

    const mountain = new THREE.Mesh(
        new THREE.ConeGeometry(
            80 + Math.random() * 100,
            120 + Math.random() * 180,
            6
        ),
        mountainMaterials[
            Math.floor(Math.random() * mountainMaterials.length)
        ]
    );

    const side = Math.random() < 0.5 ? -1 : 1;

    mountain.position.set(
        (Math.random() - 0.5) * 3500,
        20,
        side * (300 + Math.random() * 250)
    );

    mountain.castShadow = true;

    scene.add(mountain);
}

////////////////////////////////////////////////////
// TREES
////////////////////////////////////////////////////

const trunkMaterial = new THREE.MeshStandardMaterial({
    map: barkTexture,
    roughness: 1
});

const leavesMaterials = [
    new THREE.MeshStandardMaterial({
        color: 0x236b22,
        roughness: 1
    }),
    new THREE.MeshStandardMaterial({
        color: 0x347e27,
        roughness: 1
    }),
    new THREE.MeshStandardMaterial({
        color: 0x174d20,
        roughness: 1
    })
];

for (let i = 0; i < 550; i++) {

    const tree = new THREE.Group();

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.5,
            0.8,
            9,
            8
        ),
        trunkMaterial
    );

    trunk.position.y = 4.5;

    trunk.castShadow = true;

    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(
            4,
            12,
            12
        ),
        leavesMaterials[
            Math.floor(Math.random() * leavesMaterials.length)
        ]
    );

    leaves.position.y = 10;

    leaves.scale.y = 1.5;

    leaves.castShadow = true;

    tree.add(trunk);
    tree.add(leaves);

    const x = (Math.random() - 0.5) * 3500;

    const side = Math.random() < 0.5 ? -1 : 1;

    const z = side * (
        40 + Math.random() * 300
    );

    tree.position.set(
        x,
        heightAt(x, z),
        z
    );

    tree.scale.setScalar(
        0.7 + Math.random() * 1.5
    );

    scene.add(tree);
}

////////////////////////////////////////////////////
// ROCKS
////////////////////////////////////////////////////

const rockMaterial = new THREE.MeshStandardMaterial({
    color: 0x777b76,
    roughness: 1
});

for (let i = 0; i < 250; i++) {

    const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(
            2 + Math.random() * 5,
            1
        ),
        rockMaterial
    );

    const x = (Math.random() - 0.5) * 3500;

    const z = (Math.random() - 0.5) * 450;

    rock.position.set(
        x,
        heightAt(x, z) + 1,
        z
    );

    rock.rotation.set(
        Math.random(),
        Math.random(),
        Math.random()
    );

    rock.castShadow = true;

    scene.add(rock);
}

////////////////////////////////////////////////////
// CAR
////////////////////////////////////////////////////

const car = new THREE.Group();

const redPaint = new THREE.MeshStandardMaterial({
    color: 0xd80000,
    metalness: 0.8,
    roughness: 0.2
});

const blackPaint = new THREE.MeshStandardMaterial({
    color: 0x111111,
    metalness: 0.5,
    roughness: 0.3
});

const glassMaterial = new THREE.MeshStandardMaterial({
    color: 0x162e40,
    metalness: 0.7,
    roughness: 0.1
});

const chromeMaterial = new THREE.MeshStandardMaterial({
    color: 0xcccccc,
    metalness: 0.9,
    roughness: 0.15
});

// Main body

const body = new THREE.Mesh(
    new THREE.BoxGeometry(8, 2.5, 4),
    redPaint
);

body.position.y = 2;

body.castShadow = true;

car.add(body);

// Hood

const hood = new THREE.Mesh(
    new THREE.BoxGeometry(2.5, 0.35, 3.8),
    redPaint
);

hood.position.set(2.6, 3.2, 0);

car.add(hood);

// Roof

const roof = new THREE.Mesh(
    new THREE.BoxGeometry(4, 1.8, 3),
    redPaint
);

roof.position.y = 4;

roof.castShadow = true;

car.add(roof);

// Windows

const windshield = new THREE.Mesh(
    new THREE.BoxGeometry(0.15, 1.3, 2.8),
    glassMaterial
);

windshield.position.set(2.05, 4, 0);

car.add(windshield);

const rearWindow = windshield.clone();

rearWindow.position.x = -2.05;

car.add(rearWindow);

// Side windows

for (const side of [-1, 1]) {

    const windowMesh = new THREE.Mesh(
        new THREE.BoxGeometry(3.5, 1.1, 0.12),
        glassMaterial
    );

    windowMesh.position.set(
        0,
        4,
        side * 1.55
    );

    car.add(windowMesh);
}

// Wheels

const wheels = [];

function wheel(x, z) {

    const group = new THREE.Group();

    const tire = new THREE.Mesh(
        new THREE.CylinderGeometry(
            1,
            1,
            0.7,
            32
        ),
        blackPaint
    );

    tire.rotation.x = Math.PI / 2;

    group.add(tire);

    const rim = new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.55,
            0.55,
            0.73,
            24
        ),
        chromeMaterial
    );

    rim.rotation.x = Math.PI / 2;

    group.add(rim);

    group.position.set(x, 1, z);

    car.add(group);

    wheels.push(group);
}

wheel(-2.5, -2);
wheel(2.5, -2);
wheel(-2.5, 2);
wheel(2.5, 2);

// Headlights

for (const side of [-1, 1]) {

    const headlight = new THREE.Mesh(
        new THREE.BoxGeometry(0.2, 0.6, 0.8),
        new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: 0xffffcc,
            emissiveIntensity: 1
        })
    );

    headlight.position.set(
        4.05,
        2.5,
        side * 1.3
    );

    car.add(headlight);
}

// Rear lights

for (const side of [-1, 1]) {

    const rearLight = new THREE.Mesh(
        new THREE.BoxGeometry(0.2, 0.6, 0.8),
        new THREE.MeshStandardMaterial({
            color: 0xff0000,
            emissive: 0xff0000,
            emissiveIntensity: 0.7
        })
    );

    rearLight.position.set(
        -4.05,
        2.5,
        side * 1.3
    );

    car.add(rearLight);
}

// Exhaust

for (const side of [-1, 1]) {

    const exhaust = new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.18,
            0.18,
            0.8,
            12
        ),
        chromeMaterial
    );

    exhaust.rotation.z = Math.PI / 2;

    exhaust.position.set(
        -4.3,
        0.9,
        side
    );

    car.add(exhaust);
}

scene.add(car);

////////////////////////////////////////////////////
// VEHICLE PHYSICS
////////////////////////////////////////////////////

let velocity = new THREE.Vector3(0, 0, 0);

let heading = 0;

let verticalVelocity = 0;

let isAirborne = false;

let grounded = true;

let totalDistance = 0;

const MAX_LAUNCH_POWER = 85;

////////////////////////////////////////////////////
// SLINGSHOT CONTROLS
////////////////////////////////////////////////////

const slingshot = document.getElementById("slingshot");

const handle = document.getElementById("slingshotHandle");

const powerText = document.getElementById("launchPower");

const statusText = document.getElementById("status");

let dragging = false;

let dragX = 0;
let dragY = 0;

const centerX = 150;
const centerY = 60;

const MAX_DRAG = 45;

function moveHandle(x, y) {

    const dx = x - centerX;
    const dy = y - centerY;

    const distance = Math.sqrt(
        dx * dx + dy * dy
    );

    const scale = Math.min(
        1,
        MAX_DRAG / Math.max(distance, 0.001)
    );

    dragX = dx * scale;
    dragY = dy * scale;

    handle.style.left =
        `${centerX + dragX}px`;

    handle.style.top =
        `${centerY + dragY}px`;

    // Pulling down increases launch power.
    const backwardPower = Math.max(
        0,
        dragY / MAX_DRAG
    );

    const sideways = Math.min(
        1,
        Math.abs(dragX) / MAX_DRAG
    );

    const power = Math.round(
        backwardPower * 100
    );

    powerText.textContent = power + "%";
}

function resetHandle() {

    handle.style.left = "50%";
    handle.style.top = "50%";

    dragX = 0;
    dragY = 0;

    powerText.textContent = "0%";
}

handle.addEventListener("pointerdown", e => {

    dragging = true;

    handle.setPointerCapture(e.pointerId);

    e.preventDefault();
});

handle.addEventListener("pointermove", e => {

    if (!dragging) return;

    const rect = slingshot.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    moveHandle(x, y);
});

handle.addEventListener("pointerup", () => {

    if (!dragging) return;

    dragging = false;

    launchCar();

    resetHandle();
});

handle.addEventListener("pointercancel", () => {

    dragging = false;

    resetHandle();
});

////////////////////////////////////////////////////
// LAUNCH CAR
////////////////////////////////////////////////////

function launchCar() {

    const power = THREE.MathUtils.clamp(
        dragY / MAX_DRAG,
        0,
        1
    );

    if (power < 0.05) {

        statusText.innerHTML =
            "Pull farther back to launch!";

        return;
    }

    const launchSpeed =
        15 + power * MAX_LAUNCH_POWER;

    // Sideways dragging changes direction.
    const steeringAngle =
        -dragX / MAX_DRAG * 0.65;

    heading += steeringAngle;

    const forward = new THREE.Vector3(
        Math.cos(heading),
        0,
        -Math.sin(heading)
    );

    velocity.copy(forward).multiplyScalar(
        launchSpeed
    );

    verticalVelocity = 0;

    isAirborne = false;

    grounded = true;

    statusText.innerHTML =
        "LAUNCHING! " + Math.round(launchSpeed) + " POWER";

}

////////////////////////////////////////////////////
// RESET CAR
////////////////////////////////////////////////////

function resetCar() {

    car.position.set(
        0,
        heightAt(0, 0) + 1,
        0
    );

    heading = 0;

    velocity.set(0, 0, 0);

    verticalVelocity = 0;

    isAirborne = false;

    grounded = true;

    totalDistance = 0;

    car.rotation.set(0, 0, 0);

    statusText.innerHTML =
        "Ready to launch";

}

document.getElementById("resetButton").addEventListener(
    "click",
    resetCar
);

////////////////////////////////////////////////////
// VEHICLE UPDATE
////////////////////////////////////////////////////

const clock = new THREE.Clock();

function updateVehicle(delta) {

    delta = Math.min(delta, 0.04);

    const oldPosition = car.position.clone();

    const groundHeight = heightAt(
        car.position.x,
        car.position.z
    );

    // Gravity

    if (isAirborne) {

        verticalVelocity -= 24 * delta;

        car.position.y += verticalVelocity * delta;

        if (car.position.y <= groundHeight + 1) {

            car.position.y = groundHeight + 1;

            verticalVelocity = 0;

            isAirborne = false;

            statusText.innerHTML =
                "Landed! Pull back to launch again";
        }
    }

    // Ground physics

    if (!isAirborne) {

        car.position.y = groundHeight + 1;

        // Terrain slopes affect the vehicle.
        const frontHeight = heightAt(
            car.position.x + Math.cos(heading) * 4,
            car.position.z - Math.sin(heading) * 4
        );

        const slope = frontHeight - groundHeight;

        velocity.y += -slope * 0.8 * delta;

        // Small bumps and hills.

        if (Math.abs(velocity.y) > 30) {

            verticalVelocity = 8;

            isAirborne = true;
        }
    }

    // Move car.

    car.position.x += velocity.x * delta;

    car.position.z += velocity.z * delta;

    // Air resistance / friction.

    const friction = isAirborne ? 0.998 : 0.985;

    velocity.x *= Math.pow(friction, delta * 60);

    velocity.z *= Math.pow(friction, delta * 60);

    // Natural speed reduction.

    const currentSpeed = Math.sqrt(
        velocity.x * velocity.x +
        velocity.z * velocity.z
    );

    if (currentSpeed < 0.15) {

        velocity.set(0, 0, 0);
    }

    // Car orientation.

    const direction = new THREE.Vector3(
        velocity.x,
        0,
        velocity.z
    );

    if (direction.length() > 0.5) {

        heading = Math.atan2(
            -direction.z,
            direction.x
        );
    }

    car.rotation.y = -heading;

    // Rotate wheels.

    wheels.forEach(w => {

        w.children[0].rotation.z +=
            currentSpeed * delta;

        w.children[1].rotation.z +=
            currentSpeed * delta;
    });

    // Distance.

    totalDistance += oldPosition.distanceTo(
        car.position
    );

    // Speedometer.

    const mph = Math.round(
        currentSpeed * 2.237
    );

    document.getElementById("speedText").textContent =
        mph + " MPH";

    document.getElementById("needle").style.transform =
        `rotate(${Math.min(130, -130 + mph * 2)}deg)`;

}

////////////////////////////////////////////////////
// CAMERA - BEHIND THE CAR
////////////////////////////////////////////////////

const cameraOffset = new THREE.Vector3(
    -24,
    10,
    0
);

function updateCamera(delta) {

    // Camera follows the back of the vehicle.

    const offset = cameraOffset.clone();

    offset.applyAxisAngle(
        new THREE.Vector3(0, 1, 0),
        -heading
    );

    const desiredPosition = car.position.clone().add(
        offset
    );

    camera.position.lerp(
        desiredPosition,
        1 - Math.pow(0.001, delta)
    );

    const lookTarget = car.position.clone();

    lookTarget.x += Math.cos(heading) * 10;

    lookTarget.z -= Math.sin(heading) * 10;

    lookTarget.y += 3;

    camera.lookAt(lookTarget);
}

////////////////////////////////////////////////////
// SKY SUN
////////////////////////////////////////////////////

const sunSphere = new THREE.Mesh(
    new THREE.SphereGeometry(25, 32, 32),
    new THREE.MeshBasicMaterial({
        color: 0xffff66
    })
);

sunSphere.position.set(
    500,
    450,
    -700
);

scene.add(sunSphere);

////////////////////////////////////////////////////
// INITIAL POSITION
////////////////////////////////////////////////////

resetCar();

camera.position.set(-24, 12, 0);

camera.lookAt(car.position);

////////////////////////////////////////////////////
// GAME LOOP
////////////////////////////////////////////////////

function animate() {

    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    updateVehicle(delta);

    updateCamera(delta);

    renderer.render(
        scene,
        camera
    );
}

animate();

////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>

</body>
</html>
