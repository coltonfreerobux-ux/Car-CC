<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Driving Demo</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#87ceeb;
}

#hud{
    position:absolute;
    top:20px;
    left:20px;
    z-index:100;
    color:white;
}

#speedometer{
    width:180px;
    height:180px;
    border:6px solid white;
    border-radius:50%;
    position:relative;
    background:rgba(0,0,0,0.4);
}

#needle{
    width:4px;
    height:75px;
    background:red;
    position:absolute;
    left:88px;
    top:15px;
    transform-origin:bottom center;
    transform:rotate(-130deg);
}

#speedText{
    text-align:center;
    margin-top:12px;
    font-size:24px;
    font-weight:bold;
}

#controls{
    margin-top:15px;
    font-size:18px;
}
</style>
</head>

<body>

<div id="hud">
    <div id="speedometer">
        <div id="needle"></div>
    </div>

    <div id="speedText">0 MPH</div>

    <div id="controls">
        W = Gas<br>
        S = Brake<br>
        A = Left<br>
        D = Right
    </div>
</div>

<script type="module">

import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

////////////////////////////////////////////////////
//// SCENE
////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,100,1000);

const camera = new THREE.PerspectiveCamera(
70,
window.innerWidth/window.innerHeight,
0.1,
5000
);

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.shadowMap.enabled=true;

document.body.appendChild(renderer.domElement);

////////////////////////////////////////////////////
//// LIGHTING
////////////////////////////////////////////////////

const sun = new THREE.DirectionalLight(
0xffffff,
2
);

sun.position.set(
200,
300,
100
);

sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

scene.add(sun);

scene.add(
new THREE.AmbientLight(
0xffffff,
0.5
)
);

////////////////////////////////////////////////////
//// TERRAIN
////////////////////////////////////////////////////

function heightAt(x){

return (
Math.sin(x*0.01)*12 +
Math.sin(x*0.03)*5 +
Math.sin(x*0.07)*2
);

}

////////////////////////////////////////////////////
//// ROAD
////////////////////////////////////////////////////

const roadPoints=[];

for(let x=0;x<4000;x+=10){

roadPoints.push(
new THREE.Vector3(
x,
heightAt(x),
0
)
);

}

const roadCurve =
new THREE.CatmullRomCurve3(
roadPoints
);

const roadGeo =
new THREE.TubeGeometry(
roadCurve,
1200,
6,
20,
false
);

const roadMat =
new THREE.MeshStandardMaterial({
color:0x333333
});

const road =
new THREE.Mesh(
roadGeo,
roadMat
);

road.receiveShadow=true;

scene.add(road);

////////////////////////////////////////////////////
//// BRIDGES
////////////////////////////////////////////////////

for(let i=500;i<3500;i+=900){

const bridge =
new THREE.Mesh(
new THREE.BoxGeometry(
140,
3,
18
),
new THREE.MeshStandardMaterial({
color:0x888888
})
);

bridge.position.set(
i,
heightAt(i)+25,
0
);

bridge.castShadow=true;

scene.add(bridge);

for(let side of [-6,6]){

const support =
new THREE.Mesh(
new THREE.BoxGeometry(
3,
50,
3
),
new THREE.MeshStandardMaterial({
color:0x666666
})
);

support.position.set(
i,
heightAt(i),
side
);

scene.add(support);

}

}

////////////////////////////////////////////////////
//// TREES
////////////////////////////////////////////////////

for(let i=0;i<350;i++){

const tree =
new THREE.Group();

const trunk =
new THREE.Mesh(
new THREE.CylinderGeometry(
0.5,
0.7,
6
),
new THREE.MeshStandardMaterial({
color:0x6d4c41
})
);

const top =
new THREE.Mesh(
new THREE.SphereGeometry(
3,
12,
12
),
new THREE.MeshStandardMaterial({
color:0x228b22
})
);

top.position.y=6;

tree.add(trunk);
tree.add(top);

let x=Math.random()*4000;

tree.position.set(
x,
heightAt(x),
(Math.random()-0.5)*120
);

scene.add(tree);

}

////////////////////////////////////////////////////
//// CAR
////////////////////////////////////////////////////

const car =
new THREE.Group();

const body =
new THREE.Mesh(
new THREE.BoxGeometry(
8,
2.5,
4
),
new THREE.MeshStandardMaterial({
color:0xff2020,
metalness:0.7,
roughness:0.2
})
);

body.position.y=2;

car.add(body);

const roof =
new THREE.Mesh(
new THREE.BoxGeometry(
4,
2,
3
),
new THREE.MeshStandardMaterial({
color:0xaa0000
})
);

roof.position.y=4;

car.add(roof);

function wheel(x,z){

const w =
new THREE.Mesh(
new THREE.CylinderGeometry(
1,
1,
1,
24
),
new THREE.MeshStandardMaterial({
color:0x111111
})
);

w.rotation.z=Math.PI/2;

w.position.set(
x,
0,
z
);

return w;

}

car.add(wheel(-2,-2));
car.add(wheel(2,-2));
car.add(wheel(-2,2));
car.add(wheel(2,2));

scene.add(car);

////////////////////////////////////////////////////
//// CONTROLS
////////////////////////////////////////////////////

const keys={};

window.addEventListener(
'keydown',
e=>keys[e.key.toLowerCase()]=true
);

window.addEventListener(
'keyup',
e=>keys[e.key.toLowerCase()]=false
);

////////////////////////////////////////////////////
//// PHYSICS
////////////////////////////////////////////////////

let progress=0.02;
let speed=0;
let steering=0;

function updateVehicle(){

if(keys.w)
speed+=0.0025;

if(keys.s)
speed-=0.003;

speed*=0.992;

speed=Math.max(
-0.12,
Math.min(
0.35,
speed
)
);

if(keys.a)
steering+=0.018;

if(keys.d)
steering-=0.018;

steering*=0.94;

const current=
roadCurve.getPointAt(progress);

const next=
roadCurve.getPointAt(
Math.min(progress+0.0001,1)
);

const slope=
next.y-current.y;

speed+=(-slope)*0.0006;

progress+=speed*0.0015;

if(progress<0)
progress=0;

if(progress>0.999)
progress=0;

const position=
roadCurve.getPointAt(progress);

const ahead=
roadCurve.getPointAt(
Math.min(
progress+0.001,
1
)
);

car.position.copy(position);

car.lookAt(ahead);

car.rotateY(
steering
);

const mph=
Math.abs(
Math.round(speed*800)
);

document.getElementById(
"speedText"
).innerHTML=
mph+" MPH";

document.getElementById(
"needle"
).style.transform=
`rotate(${(-130)+(mph*2)}deg)`;

}

////////////////////////////////////////////////////
//// CAMERA
////////////////////////////////////////////////////

function updateCamera(){

const offset=
new THREE.Vector3(
-25,
12,
12
);

offset.applyQuaternion(
car.quaternion
);

camera.position.lerp(
car.position.clone().add(offset),
0.08
);

camera.lookAt(
car.position.x,
car.position.y+2,
car.position.z
);

}

////////////////////////////////////////////////////
//// SKY SUN
////////////////////////////////////////////////////

const sunSphere =
new THREE.Mesh(
new THREE.SphereGeometry(
20,
24,
24
),
new THREE.MeshBasicMaterial({
color:0xffff66
})
);

sunSphere.position.set(
500,
350,
-600
);

scene.add(sunSphere);

////////////////////////////////////////////////////
//// LOOP
////////////////////////////////////////////////////

function animate(){

requestAnimationFrame(
animate
);

updateVehicle();

updateCamera();

renderer.render(
scene,
camera
);

}

animate();

////////////////////////////////////////////////////
//// RESIZE
////////////////////////////////////////////////////

window.addEventListener(
'resize',
()=>{

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
