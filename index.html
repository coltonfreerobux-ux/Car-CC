<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valley Slingshot Driving</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#87ceeb}canvas{display:block}#hud{position:absolute;top:18px;left:18px;z-index:2;color:#fff;text-shadow:2px 2px 5px #000}#speedometer{width:120px;height:120px;border:4px solid white;border-radius:50%;background:#000a;position:relative}#needle{position:absolute;width:4px;height:48px;left:54px;top:12px;background:#f33;border-radius:5px;transform-origin:bottom center;transform:rotate(-130deg)}#speedText{text-align:center;font-size:21px;font-weight:bold;margin-top:8px}#slingshot{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:300px;height:145px;background:#0f190fd9;border:2px solid #fffc;border-radius:16px;color:white;text-align:center;padding:10px;z-index:3;user-select:none;touch-action:none}#slingshotTitle{font-size:17px;font-weight:bold;margin-bottom:5px}#slingshotArea{width:100%;height:78px;position:relative;border-radius:10px;background:#ffffff14;overflow:hidden;touch-action:none}#slingshotCenter,#slingshotHandle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%}#slingshotCenter{width:14px;height:14px;background:white;border:3px solid #65d66b;pointer-events:none}#slingshotHandle{width:30px;height:30px;background:#ffb52e;border:3px solid white;box-shadow:0 0 12px #ffb52ecc;cursor:grab}#slingshotText{font-size:12px;margin-top:5px;color:#ddd}#resetButton{position:absolute;top:20px;right:20px;z-index:3;padding:12px 18px;color:white;background:#b52626;border:2px solid white;border-radius:8px;font-weight:bold;cursor:pointer}#help{position:absolute;right:20px;bottom:180px;color:white;background:#0009;padding:12px;border-radius:8px;font-size:13px;line-height:1.5;z-index:2}@media(max-width:600px){#help{right:10px;bottom:180px;font-size:11px;padding:8px}#slingshot{bottom:12px}}
</style>
</head>
<body>
<div id="hud"><div id="speedometer"><div id="needle"></div></div><div id="speedText">0 MPH</div></div>
<button id="resetButton">RESET CAR</button>
<div id="help">Pull slingshot down and release to launch.<br>A / D or ← / → to steer.<br>Downhill adds speed; uphill slows you.</div>
<div id="slingshot"><div id="slingshotTitle">SLINGSHOT</div><div id="slingshotArea"><div id="slingshotCenter"></div><div id="slingshotHandle"></div></div><div id="slingshotText">Pull down and release to launch!</div></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,350,2400);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,5000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8efff,0x405b2a,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(200,350,100);scene.add(sun);

// A broad, rolling valley. The central route has gentle hills; the edges rise into ridges.
function heightAt(x,z){
  const valleySides=48*(1-Math.exp(-Math.pow(Math.max(0,Math.abs(z)-90)/300,2)));
  const longHills=14*Math.sin(x*.0017)+6*Math.sin(x*.0035+.7);
  const crossHills=2.2*Math.sin(z*.012+x*.0008);
  return valleySides+longHills+crossHills;
}
function heightDerivatives(x,z){
  const dx=(heightAt(x+.5,z)-heightAt(x-.5,z));
  const dz=(heightAt(x,z+.5)-heightAt(x,z-.5));
  return {x:dx,z:dz};
}

// Procedural grass texture gives the ground some visible detail without external assets.
function makeGrassTexture(size=512){
  const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#598d39';ctx.fillRect(0,0,size,size);
  const colors=['#6b9c45','#4b7e32','#78a64f','#3f702c','#5c8d3c'];
  for(let i=0;i<14000;i++){
    const x=Math.random()*size,y=Math.random()*size;
    ctx.strokeStyle=colors[Math.floor(Math.random()*colors.length)];
    ctx.globalAlpha=.35+Math.random()*.5;ctx.lineWidth=.6+Math.random()*1.5;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(Math.random()-.5)*4,y-2-Math.random()*6);ctx.stroke();
  }
  ctx.globalAlpha=1;
  const texture=new THREE.CanvasTexture(canvas);texture.wrapS=texture.wrapT=THREE.RepeatWrapping;
  texture.repeat.set(55,18);texture.colorSpace=THREE.SRGBColorSpace;return texture;
}
const groundGeo=new THREE.PlaneGeometry(5000,1400,300,100);groundGeo.rotateX(-Math.PI/2);
const positions=groundGeo.attributes.position;
for(let i=0;i<positions.count;i++)positions.setY(i,heightAt(positions.getX(i),positions.getZ(i)));
groundGeo.computeVertexNormals();
const ground=new THREE.Mesh(groundGeo,new THREE.MeshStandardMaterial({map:makeGrassTexture(),roughness:1}));
ground.receiveShadow=true;scene.add(ground);

// Distant, low-poly valley ridges frame the open driving area.
const ridgeMaterials=[0x496f3d,0x547b45,0x3f6338].map(color=>new THREE.MeshStandardMaterial({color,roughness:1}));
for(const side of [-1,1]){
  for(let i=0;i<12;i++){
    const x=-2400+i*420+(Math.random()-.5)*100;
    const h=100+Math.random()*150,w=170+Math.random()*150;
    const ridge=new THREE.Mesh(new THREE.ConeGeometry(w,h,7),ridgeMaterials[i%ridgeMaterials.length]);
    ridge.position.set(x,heightAt(x,side*520)+h*.38,side*(530+Math.random()*100));
    ridge.scale.z=1.3;ridge.rotation.y=Math.random()*Math.PI;scene.add(ridge);
  }
}

// Trees line the valley slopes and leave plenty of room around the central route.
const trunkMat=new THREE.MeshStandardMaterial({color:0x684528,roughness:1});
const foliage=[0x276b2d,0x347d35,0x1e5927,0x4b8740].map(color=>new THREE.MeshStandardMaterial({color,roughness:1}));
function addTree(x,z,scale){
  const y=heightAt(x,z),group=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.28*scale,.45*scale,4.2*scale,7),trunkMat);
  trunk.position.y=2.1*scale;trunk.castShadow=true;group.add(trunk);
  for(let j=0;j<3;j++){
    const crown=new THREE.Mesh(new THREE.ConeGeometry((2.5-j*.35)*scale,3.8*scale,8),foliage[Math.floor(Math.random()*foliage.length)]);
    crown.position.y=(4.1+j*1.65)*scale;crown.castShadow=true;group.add(crown);
  }
  group.position.set(x,y,z);scene.add(group);
}
for(let i=0;i<230;i++){
  const x=(Math.random()-.5)*4700;
  const side=Math.random()<.5?-1:1;
  const z=side*(150+Math.random()*420);
  addTree(x,z,.65+Math.random()*.75);
}

// Vehicle faces local +X.
const car=new THREE.Group();
const red=new THREE.MeshStandardMaterial({color:0xd50000,metalness:.3,roughness:.36});
const black=new THREE.MeshStandardMaterial({color:0x171717,roughness:.8});
const glass=new THREE.MeshStandardMaterial({color:0x183648,metalness:.15,roughness:.28});
const chrome=new THREE.MeshStandardMaterial({color:0xc2c8ca,metalness:.7,roughness:.25});
function carBox(w,h,d,mat,x,y,z){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);mesh.position.set(x,y,z);mesh.castShadow=true;car.add(mesh);return mesh;}
carBox(8,2.2,4,red,0,2,0);carBox(4,1.8,3,red,-.2,3.8,0);carBox(2.4,.3,3.8,red,2.6,3,0);
carBox(.16,1.2,2.8,glass,1.9,3.8,0);carBox(.16,1.2,2.8,glass,-2,3.8,0);
for(const side of [-1,1])carBox(3.2,1,.12,glass,0,3.8,side*1.52);
const wheels=[];
for(const x of [-2.5,2.5])for(const z of [-2,2]){
  const wheel=new THREE.Group();const tire=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.7,24),black);tire.rotation.x=Math.PI/2;wheel.add(tire);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(.52,.52,.73,20),chrome);rim.rotation.x=Math.PI/2;wheel.add(rim);
  wheel.position.set(x,1,z);car.add(wheel);wheels.push(wheel);
}
scene.add(car);

const handle=document.getElementById('slingshotHandle');
const status=document.getElementById('slingshotText');
const speedText=document.getElementById('speedText');
const needle=document.getElementById('needle');
const maxPull=55;
let heading=0,speed=0,dragging=false,startX=0,startY=0,pullX=0,pullY=0;
const keys=new Set();
function moveHandle(x,y){handle.style.left=`calc(50% + ${x}px)`;handle.style.top=`calc(50% + ${y}px)`;}
function resetCar(){car.position.set(0,heightAt(0,0),0);heading=0;speed=0;car.rotation.set(0,0,0);moveHandle(0,0);speedText.textContent='0 MPH';needle.style.transform='rotate(-130deg)';}
resetCar();
handle.addEventListener('pointerdown',e=>{e.preventDefault();dragging=true;startX=e.clientX;startY=e.clientY;pullX=0;pullY=0;handle.setPointerCapture(e.pointerId);});
handle.addEventListener('pointermove',e=>{
  if(!dragging)return;e.preventDefault();pullX=THREE.MathUtils.clamp(e.clientX-startX,-maxPull,maxPull);pullY=THREE.MathUtils.clamp(e.clientY-startY,-maxPull,maxPull);moveHandle(pullX,pullY);
  status.textContent=`Launch power: ${Math.round(Math.max(0,pullY)/maxPull*100)}%`;
});
function release(){
  if(!dragging)return;dragging=false;const power=THREE.MathUtils.clamp(pullY/maxPull,0,1);const aim=THREE.MathUtils.clamp(pullX/maxPull,-1,1);
  if(power>.04){heading=-aim*.8;speed=18+power*55;status.textContent='LAUNCHED! Use A/D or arrows to steer.';}else status.textContent='Pull down and release to launch!';
  pullX=0;pullY=0;moveHandle(0,0);
}
handle.addEventListener('pointerup',release);handle.addEventListener('pointercancel',release);
document.getElementById('resetButton').addEventListener('click',()=>{resetCar();status.textContent='Pull down and release to launch!';});
window.addEventListener('keydown',e=>{const key=e.key.toLowerCase();if(['a','d','arrowleft','arrowright'].includes(key)){e.preventDefault();keys.add(key);}});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>keys.clear());

const cameraTarget=new THREE.Vector3(),cameraDesired=new THREE.Vector3();
let lastTime=performance.now();
function animate(now){
  requestAnimationFrame(animate);const dt=Math.min((now-lastTime)/1000,.04);lastTime=now;
  // Hills convert potential energy into speed downhill and take speed uphill.
  const direction= speed<0 ? -1 : 1;
  const downhillSlope=heightDerivatives(car.position.x,car.position.z);
  const slopeAlongHeading=downhillSlope.x*Math.cos(heading)-downhillSlope.z*Math.sin(heading);
  if(Math.abs(speed)>.05){
    const gravityAccel=-9.8*slopeAlongHeading;
    const rollingResistance=.32*direction;
    speed+=(gravityAccel-rollingResistance)*dt;
  }else if(Math.abs(speed)<=.05){speed=0;}
  speed=THREE.MathUtils.clamp(speed,-15,105);

  const steer=(keys.has('a')||keys.has('arrowleft')?1:0)-(keys.has('d')||keys.has('arrowright')?1:0);
  if(steer!==0&&Math.abs(speed)>.15){
    const steeringRate=1.5*Math.min(1,Math.abs(speed)/7);
    heading+=steer*steeringRate*dt*(speed<0?-1:1);
  }
  car.position.x+=Math.cos(heading)*speed*dt;
  car.position.z-=Math.sin(heading)*speed*dt;
  car.position.x=THREE.MathUtils.clamp(car.position.x,-2450,2450);
  car.position.z=THREE.MathUtils.clamp(car.position.z,-650,650);
  car.position.y=heightAt(car.position.x,car.position.z);
  car.rotation.y=heading;
  for(const wheel of wheels)wheel.rotation.z-=speed*dt*1.5;
  const mph=Math.round(Math.abs(speed)*2.237);speedText.textContent=`${mph} MPH`;
  needle.style.transform=`rotate(${THREE.MathUtils.clamp(-130+mph*2,-130,130)}deg)`;

  cameraDesired.set(car.position.x-Math.cos(heading)*22,car.position.y+10,car.position.z+Math.sin(heading)*22);
  cameraTarget.set(car.position.x+Math.cos(heading)*8,car.position.y+2.5,car.position.z-Math.sin(heading)*8);
  camera.position.lerp(cameraDesired,1-Math.pow(.002,dt));camera.lookAt(cameraTarget);
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
