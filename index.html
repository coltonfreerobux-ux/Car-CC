<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valley Slingshot Driving</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#87ceeb}canvas{display:block}#hud{position:absolute;top:18px;left:18px;z-index:2;color:#fff;text-shadow:2px 2px 5px #000}#speedometer{width:120px;height:120px;border:4px solid white;border-radius:50%;background:#000a;position:relative}#needle{position:absolute;width:4px;height:48px;left:54px;top:12px;background:#f33;border-radius:5px;transform-origin:bottom center;transform:rotate(-130deg)}#speedText{text-align:center;font-size:21px;font-weight:bold;margin-top:8px}#slingshot{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:300px;height:145px;background:#0f190fd9;border:2px solid #fffc;border-radius:16px;color:white;text-align:center;padding:10px;z-index:3;user-select:none;touch-action:none}#slingshotTitle{font-size:17px;font-weight:bold;margin-bottom:5px}#slingshotArea{width:100%;height:78px;position:relative;border-radius:10px;background:#ffffff14;overflow:hidden;touch-action:none}#slingshotCenter,#slingshotHandle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%}#slingshotCenter{width:14px;height:14px;background:white;border:3px solid #65d66b;pointer-events:none}#slingshotHandle{width:30px;height:30px;background:#ffb52e;border:3px solid white;box-shadow:0 0 12px #ffb52ecc;cursor:grab}#slingshotText{font-size:12px;margin-top:5px;color:#ddd}#resetButton{position:absolute;top:20px;right:20px;z-index:3;padding:12px 18px;color:white;background:#b52626;border:2px solid white;border-radius:8px;font-weight:bold;cursor:pointer}#help{position:absolute;right:20px;bottom:180px;color:white;background:#0009;padding:12px;border-radius:8px;font-size:13px;line-height:1.5;z-index:2}@media(max-width:600px){#help{right:10px;bottom:180px;font-size:11px;padding:8px}#slingshot{bottom:12px}}
</style>
</head>
<body>
<div id="hud"><div id="speedometer"><div id="needle"></div></div><div id="speedText">0 MPH</div></div>
<button id="resetButton">RESET CAR</button>
<div id="help">Drag the slingshot downward and release to launch.<br>Pull left or right to aim.</div>
<div id="slingshot"><div id="slingshotTitle">SLINGSHOT</div><div id="slingshotArea"><div id="slingshotCenter"></div><div id="slingshotHandle"></div></div><div id="slingshotText">Pull down and release to launch!</div></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

// Create a simple, continuous valley floor and keep the car on it.
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 450, 2600);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc9eaff, 0x405b2a, 2));
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(200, 400, 100);
scene.add(sun);

function heightAt(x,z){
  // Flat driving strip in the middle, with valley sides rising on both sides.
  const sides = 55 * (1 - Math.exp(-Math.pow(Math.max(0, Math.abs(z)-45)/230, 2)));
  const gentleRoll = Math.sin(x*0.003)*2 + Math.sin(x*0.009 + z*0.006)*1.2;
  return sides + gentleRoll;
}
const groundGeo = new THREE.PlaneGeometry(5000, 1400, 240, 100);
groundGeo.rotateX(-Math.PI/2);
const groundPos = groundGeo.attributes.position;
for(let i=0;i<groundPos.count;i++) groundPos.setY(i,heightAt(groundPos.getX(i),groundPos.getZ(i)));
groundGeo.computeVertexNormals();
const ground = new THREE.Mesh(groundGeo,new THREE.MeshStandardMaterial({color:0x548b38,roughness:1}));
ground.receiveShadow = true;
scene.add(ground);

// Simple green valley ridges along the sides; the driveable center stays open.
const hillMat = new THREE.MeshStandardMaterial({color:0x456b3c,roughness:1});
for(const side of [-1,1]){
  const ridge = new THREE.Mesh(new THREE.CylinderGeometry(55,100,5000,24,1,true),hillMat);
  ridge.rotation.z = Math.PI/2;
  ridge.scale.y = 1.8;
  ridge.position.set(0,33,side*390);
  scene.add(ridge);
}

// Car model, oriented toward +X.
const car = new THREE.Group();
const red = new THREE.MeshStandardMaterial({color:0xd50000,metalness:0.35,roughness:0.35});
const black = new THREE.MeshStandardMaterial({color:0x151515,roughness:0.8});
const glass = new THREE.MeshStandardMaterial({color:0x183648,metalness:0.2,roughness:0.25});
const chrome = new THREE.MeshStandardMaterial({color:0xbfc6c9,metalness:0.75,roughness:0.25});
function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;car.add(m);return m;}
box(8,2.2,4,red,0,2,0);
box(4,1.8,3,red,-0.2,3.8,0);
box(2.4,0.3,3.8,red,2.6,3,0);
box(0.16,1.2,2.8,glass,1.9,3.8,0);
box(0.16,1.2,2.8,glass,-2,3.8,0);
for(const side of [-1,1]) box(3.2,1,0.12,glass,0,3.8,side*1.52);
const wheels=[];
for(const x of [-2.5,2.5]) for(const z of [-2,2]){
  const wheel=new THREE.Group();
  const tire=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.7,24),black);
  tire.rotation.x=Math.PI/2; wheel.add(tire);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(.52,.52,.73,20),chrome);
  rim.rotation.x=Math.PI/2; wheel.add(rim);
  wheel.position.set(x,1,z); car.add(wheel); wheels.push(wheel);
}
scene.add(car);

// UI references are initialized before resetCar is called (avoids the previous startup crash).
const handle=document.getElementById('slingshotHandle');
const status=document.getElementById('slingshotText');
const speedText=document.getElementById('speedText');
const needle=document.getElementById('needle');
let heading=0, vx=0, vz=0, dragging=false, startX=0, startY=0, pullX=0, pullY=0;
const maxPull=55;
function moveHandle(x,y){handle.style.left=`calc(50% + ${x}px)`;handle.style.top=`calc(50% + ${y}px)`;}
function resetCar(){
  car.position.set(0,heightAt(0,0),0); heading=0; vx=0; vz=0;
  car.rotation.set(0,0,0); moveHandle(0,0); speedText.textContent='0 MPH'; needle.style.transform='rotate(-130deg)';
}
resetCar();
handle.addEventListener('pointerdown',e=>{
  e.preventDefault(); dragging=true; startX=e.clientX; startY=e.clientY; pullX=0; pullY=0;
  handle.setPointerCapture(e.pointerId);
});
handle.addEventListener('pointermove',e=>{
  if(!dragging)return; e.preventDefault();
  pullX=THREE.MathUtils.clamp(e.clientX-startX,-maxPull,maxPull);
  pullY=THREE.MathUtils.clamp(e.clientY-startY,-maxPull,maxPull);
  moveHandle(pullX,pullY);
  status.textContent=`Launch power: ${Math.round(Math.max(0,pullY)/maxPull*100)}%`;
});
function release(){
  if(!dragging)return; dragging=false;
  // Pulling down stretches the slingshot; releasing launches the car forward.
  const power=THREE.MathUtils.clamp(pullY/maxPull,0,1);
  const aim=THREE.MathUtils.clamp(pullX/maxPull,-1,1);
  if(power>0.04){
    heading=-aim*0.8;
    const launchSpeed=18+power*90;
    vx=Math.cos(heading)*launchSpeed;
    vz=-Math.sin(heading)*launchSpeed;
    status.textContent='LAUNCHED! Pull down again to launch.';
  }else status.textContent='Pull down and release to launch!';
  pullX=0;pullY=0;moveHandle(0,0);
}
handle.addEventListener('pointerup',release);
handle.addEventListener('pointercancel',release);
document.getElementById('resetButton').addEventListener('click',()=>{resetCar();status.textContent='Pull down and release to launch!';});

const cameraTarget=new THREE.Vector3();
const cameraDesired=new THREE.Vector3();
let lastTime=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-lastTime)/1000,0.04); lastTime=now;
  // Frame-rate independent friction and ground-following movement.
  const drag=Math.pow(0.994,dt*60); vx*=drag; vz*=drag;
  car.position.x+=vx*dt; car.position.z+=vz*dt;
  car.position.y=heightAt(car.position.x,car.position.z);
  const speed=Math.hypot(vx,vz);
  if(speed>0.5) heading=Math.atan2(-vz,vx);
  car.rotation.y=heading;
  for(const wheel of wheels) wheel.rotation.z-=speed*dt*1.5;
  const mph=Math.round(speed*2.237);
  speedText.textContent=`${mph} MPH`;
  needle.style.transform=`rotate(${THREE.MathUtils.clamp(-130+mph*2,-130,130)}deg)`;

  // Car faces +X at heading 0. Camera stays behind it and looks slightly ahead.
  cameraDesired.set(car.position.x-Math.cos(heading)*22,car.position.y+10,car.position.z+Math.sin(heading)*22);
  cameraTarget.set(car.position.x+Math.cos(heading)*8,car.position.y+2.5,car.position.z-Math.sin(heading)*8);
  camera.position.lerp(cameraDesired,1-Math.pow(0.002,dt));
  camera.lookAt(cameraTarget);
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
